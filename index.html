<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katharine Wells</title>
    <meta
      name="description"
      content="Portfolio placeholder for Katharine Wells."
    />
    <style>
      :root {
        --bg: #f5f1ea;
        --panel: #ffffff;
        --ink: #1d1d1b;
        --muted: #5d5a57;
        --line: #d9d0c4;
        --accent: #7a8d7a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
      }

      .card {
        width: min(760px, calc(100% - 2rem));
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
        padding: clamp(2rem, 4vw, 4rem);
      }

      .eyebrow {
        display: inline-block;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .tag {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--line);
        background: #f8f6f2;
        color: var(--ink);
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Portfolio Update</div>
      <h1>New work coming soon.</h1>
      <p>
        This site is being refreshed. The previous portfolio content has been temporarily
        replaced while the repository is being redesigned.
      </p>
      <div class="tag">Katharine Wells</div>
    </main>
  </body>
</html>
